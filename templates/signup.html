<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up • Chilldog</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <main class="page">
    <section class="shell" style="max-width:640px;margin:24px auto;">
      <div class="tile tile-white">
        <div class="tile-head">
          <h2>Sign up</h2>
          <span class="chip">Account</span>
        </div>

        {% if error %}
          <p style="color:#b91c1c;margin:8px 0 16px 0;">{{ error }}</p>
        {% endif %}

	<form method="post" action="/signup{% if next %}?next={{ next }}{% endif %}" class="form-col">
          <div class="form-row">
            <label class="label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" required>
          </div>

          <div class="form-row">
            <label class="label" for="password">Password</label>
            <input class="input" id="password" name="password" type="password" required minlength="6">
          </div>

          <div class="btn-row">
            <button class="btn btn-solid" type="submit">Create account</button>
            <a class="btn btn-ghost" href="/login{% if next %}?next={{ next }}{% endif %}">I already have one</a>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
