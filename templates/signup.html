<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account • Chilldog</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/styles.css', v=6) }}"
  >
</head>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

<body class="auth-page">
  <div class="auth-split">
    <aside class="auth-left" aria-hidden="true">
      <div
        class="auth-left-img"
        style="background-image: url('/static/images/auth-flower.jpg?v=4');">
      </div>
    </aside>

    <section class="auth-right">
      <div class="auth-topbar">
        <div class="auth-lang">
          <select aria-label="Language">
            <option>English (United States)</option>
            <option>中文 (Chinese) (filler)</option>
            <option>Español (Spanish) (filler)</option>
            <option>Français (French) (filler)</option>
          </select>
        </div>

        <div class="auth-top-actions">
          <span>Already have an account?</span>
          <a
            class="btn btn-ghost"
            href="/login{% if next %}?next={{ next }}{% endif %}">
            Sign in
          </a>
        </div>
      </div>

      <div class="auth-wrap">
        <div class="auth-card">
          <div class="auth-card-head">
            <div class="auth-avatar"></div>
            <h1 class="auth-title">Create an account</h1>
            <p class="auth-subtitle">
              Monitor and control your environment from anywhere with your Chilldog dashboard.
            </p>
          </div>

          {% if error %}
            <div class="auth-error">{{ error }}</div>
          {% endif %}

          <form
            class="auth-form"
            method="post"
            action="/signup{% if next %}?next={{ next }}{% endif %}"
          >
            <div class="auth-field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required />
            </div>

            <div class="auth-field">
              <label for="password">Password</label>
              <div class="pw-wrap">
                <input id="password" name="password" type="password" required minlength="6" />
                <button class="pw-toggle" type="button" aria-label="Show password" onclick="togglePw(this)">
                  Show
                </button>
              </div>
            </div>

            <label class="auth-check">
              <input type="checkbox" id="tos" />
              <span>
                By creating an account, I agree to our <u>Terms of use</u> and <u>Privacy Policy</u>
              </span>
            </label>

            <button id="createBtn" class="auth-primary" type="submit" disabled>
              Create account
            </button>
          </form>

          <div class="auth-divider">OR</div>

          <a
            class="auth-provider"
            href="/login{% if next %}?next={{ next|urlencode }}{% endif %}">
            Sign in instead
          </a>

        </div>
      </div>
    </section>
  </div>

  <script>
    const tos = document.getElementById("tos");
    const btn = document.getElementById("createBtn");

    function sync() {
      if (tos.checked) {
        btn.disabled = false;
        btn.classList.add("is-enabled");
      } else {
        btn.disabled = true;
        btn.classList.remove("is-enabled");
      }
    }

    tos.addEventListener("change", sync);
    sync();
  </script>
</body>
</html>
