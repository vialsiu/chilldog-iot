<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in • Chilldog</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/styles.css', v=7) }}"
  >
</head>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

<body class="auth-page">
  <div class="auth-split">
    <aside class="auth-left" aria-hidden="true">
      <div
        class="auth-left-img"
        style="background-image: url('/static/images/auth-flower.jpg?v=4');">
      </div>
    </aside>

    <section class="auth-right">
      <div class="auth-topbar">
        <div class="auth-lang">
          <select aria-label="Language">
            <option>English (United States)</option>
            <option>中文 (Chinese) (filler)</option>
            <option>Español (Spanish) (filler)</option>
            <option>Français (French) (filler)</option>
          </select>
        </div>

        <div class="auth-top-actions">
          <span>Don't have an account?</span>
          <a
            class="btn btn-ghost"
            href="/signup{% if next %}?next={{ next }}{% endif %}">
            Create one
          </a>
        </div>
      </div>

      <div class="auth-wrap">
        <div class="auth-card">
          <div class="auth-card-head">
            <div class="auth-avatar"></div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">
              Sign in to access your Chilldog dashboard and control your device.
            </p>
          </div>

          {% if error %}
            <div class="auth-error">{{ error }}</div>
          {% endif %}

          <form
            class="auth-form"
            method="post"
            action="/login{% if next %}?next={{ next }}{% endif %}"
          >
            <div class="auth-field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required />
            </div>

            <div class="auth-field">
              <label for="password">Password</label>
              <div class="pw-wrap">
                <input
                  id="password"
                  name="password"
                  type="password"
                  required
                  minlength="6"
                />
                <button
                  class="pw-toggle"
                  type="button"
                  aria-label="Show password"
                  onclick="togglePw(this)">
                  Show
                </button>
              </div>
            </div>

            <button class="auth-primary is-enabled" type="submit">
              Sign in
            </button>
          </form>

          <div class="auth-divider">OR</div>

          <a
            class="auth-provider"
            href="/signup{% if next %}?next={{ next|urlencode }}{% endif %}">
            Create a new account
          </a>

        </div>
      </div>
    </section>
  </div>
</body>
</html>
